<!doctype html><html lang="en"><meta charset="utf-8"><title>Jev Browser Lab</title>
<style>body{font:18px system-ui;margin:40px;max-width:850px}button,input{font:inherit;margin:10px;padding:10px}section{border:1px solid #aaa;padding:24px;margin:20px 0}label{display:block}dialog{min-width:450px} .card{padding:15px;background:#eef;margin:12px}</style>
<h1>Jev Browser Lab</h1><p>Local disposable browser acceptance tests. No accounts or external requests.</p>
<nav><button onclick="start('form')">Start form</button><button onclick="start('search')">Start search</button><button onclick="start('modal')">Start modal</button></nav><main id="main"></main>
<script>
const main=document.getElementById('main');
function start(which){
 if(which==='form')main.innerHTML=`<section><h2>Step 1: Profile</h2><label>Display name<input aria-label="Display name" id="name"></label><label>City<input aria-label="City" id="city"></label><button onclick="profile()">Continue</button><p id="err"></p></section>`;
 if(which==='search')main.innerHTML=`<section><h2>Search catalog</h2><label>Search catalog<input aria-label="Search catalog" id="query"></label><button onclick="search()">Search products</button><div id="results"></div></section>`;
 if(which==='modal')main.innerHTML=`<section><h2>Workspace settings</h2><button onclick="document.getElementById('modal').showModal()">Edit workspace</button><p id="saved">No saved workspace</p></section><dialog id="modal"><h2>Edit workspace</h2><label>Workspace name<input aria-label="Workspace name" id="workspace"></label><label><input type="checkbox" id="notify">Enable notifications</label><button onclick="save()">Save settings</button><button onclick="document.getElementById('modal').close()">Cancel edit</button></dialog>`;
}
function profile(){if(document.getElementById('name').value!=='Lin'||document.getElementById('city').value!=='Shanghai'){document.getElementById('err').textContent='Please enter Lin and Shanghai';return}main.innerHTML=`<section><h2>Step 2: Preferences</h2><label><input type="radio" name="plan" value="Basic">Basic plan</label><label><input type="radio" name="plan" value="Pro">Pro plan</label><label><input type="checkbox" id="agree">I reviewed the test details</label><button onclick="finish()">Finish profile</button><p id="err"></p></section>`}
function finish(){if(document.querySelector('input[name=plan]:checked')?.value!=='Pro'||!document.getElementById('agree').checked){document.getElementById('err').textContent='Select Pro and review details';return}main.innerHTML='<h2>Profile complete: Lin / Shanghai / Pro / reviewed</h2>'}
function search(){const q=document.getElementById('query').value;document.getElementById('results').innerHTML='<p>Loading results...</p>';setTimeout(()=>{document.getElementById('results').innerHTML=q==='penguin'?`<div class="card"><h3>Penguin notebook</h3><button onclick="main.innerHTML='<h2>Selected: Penguin notebook</h2>'">Choose Penguin notebook</button></div><div class="card"><h3>Penguin poster</h3><button onclick="main.innerHTML='<h2>Selected: Penguin poster</h2>'">Choose Penguin poster</button></div>`:'<p>No results</p>'},1400)}
function save(){const v=document.getElementById('workspace').value;const n=document.getElementById('notify').checked;document.getElementById('modal').close();document.getElementById('saved').textContent='Workspace saved: '+v+' / notifications '+(n?'on':'off')}
</script></html>
